{% extends 'blog/homepage.html' %}

{% block content %}
  <article>
    <h2>{{ post.title }}</h2>
    <p><strong>By:</strong> {{ post.author }}{% if post.published_date %} — <em>{{ post.published_date }}</em>{% endif %}</p>
    <div>
      {{ post.text|linebreaksbr }}
    </div>
    <p><a href="{% url 'post_list' %}">&larr; Back to posts</a></p>
  </article>
{% endblock %}
